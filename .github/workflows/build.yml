name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Install ldid
        run: brew install ldid

      - name: Package IPA (ldid fake-sign)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ldid -S Payload/Runner.app/Runner
          if [ -d Payload/Runner.app/Frameworks ]; then
            find Payload/Runner.app/Frameworks -maxdepth 1 -name "*.framework" | while read -r fw; do
              ldid -S "$fw/$(basename "$fw" .framework)"
            done
          fi
          zip -qry ClockAndPhotoFrame.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClockPhotoFrame-ipa
          path: ClockAndPhotoFrame.ipa
          retention-days: 30
