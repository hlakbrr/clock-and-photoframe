name: ClockAndPhotoFrame
options:
  bundleIdPrefix: com.nasframe
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ClockAndPhotoFrame:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Clock & PhotoFrame
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.nasframe.clockframe
            CFBundleURLSchemes:
              - clockframe
              - immichframe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasframe.clockframe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClockAndPhotoFrame:
    build:
      targets:
        ClockAndPhotoFrame: all
